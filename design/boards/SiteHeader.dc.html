<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Site header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Geist:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.sh a{text-decoration:none}
.sh-nav a{font-size:15px;padding:6px 2px;border-bottom:2px solid transparent}
.sh-dark .sh-nav a{color:#D6C8DF}.sh-dark .sh-nav a:hover{color:#FFFFFF}
.sh-light .sh-nav a{color:#4A3D55}.sh-light .sh-nav a:hover{color:#140C1B}
.sh-nav a[aria-current="page"]{border-bottom-color:#F0A24B}
.sh-dark .sh-nav a[aria-current="page"]{color:#FFFFFF}
.sh-light .sh-nav a[aria-current="page"]{color:#140C1B}
.sh-dl{display:inline-flex;align-items:center;height:44px;padding:0 16px;border-radius:10px;background:#F0A24B;color:#2A1534 !important;font-weight:600;font-size:14px}
.sh-dl:hover{background:#FFB866}
.sh a:focus-visible,.sh summary:focus-visible{outline:2px solid #F0A24B;outline-offset:3px;border-radius:6px}
.sh-dl{min-height:44px}
.sh-menu{display:none}.sh-menu summary::-webkit-details-marker{display:none}
@media (max-width:900px){.sh-nav,.sh-gh,.sh-news{display:none !important}.sh-menu{display:block !important}}
</style>
</helmet>
<header class="sh {{cls}}" style="font-family: Geist, ui-sans-serif, system-ui, sans-serif; background: {{bg}}; border-bottom: 1px solid {{line}}">
  <div style="max-width: 1240px; margin: 0 auto; padding: 14px 32px; display: flex; align-items: center; gap: 28px">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 11px; min-height: 44px; color: {{ink}}" aria-label="doze, home">
      <img src="/_blob/011c89d77e6c83d760300a6f93b9f3cb" alt="" style="width: 34px; height: 34px">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.01em">doze</span>
    </a>
    <nav class="sh-nav" aria-label="Site" style="display: flex; gap: 22px; flex: 1; flex-wrap: wrap">
      <sc-for list="{{items}}" as="n" hint-placeholder-count="6">
        <a href="{{n.href}}" aria-current="{{n.current}}">{{n.label}}</a>
      </sc-for>
    </nav>
    <sc-if value="{{news}}" hint-placeholder-val="{{true}}">
      <a class="sh-news" href="{{newsHref}}" style="font-size: 13px; color: {{ink}}; border: 1px solid {{line2}}; border-radius: 999px; padding: 6px 12px; white-space: nowrap"><span style="color: #F0A24B; font-weight: 600">New</span> · {{news}} →</a>
    </sc-if>
    <a class="sh-gh" href="https://github.com/doze-dev" style="font-size: 14px; color: {{ink2}}; white-space: nowrap">GitHub</a>
    <a class="sh-dl" href="Download.dc.html">Download</a>
    <details class="sh-menu" style="margin-left: auto; position: relative">
      <summary aria-label="Menu" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 10px; border: 1px solid {{line2}}; color: {{ink}}; list-style: none; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </summary>
      <nav aria-label="Site" style="position: absolute; right: 0; top: 52px; z-index: 20; width: 260px; display: flex; flex-direction: column; padding: 8px; border-radius: 14px; background: {{panel}}; border: 1px solid {{line2}}; box-shadow: 0 24px 60px rgba(0,0,0,0.35)">
        <sc-for list="{{items}}" as="n" hint-placeholder-count="6">
          <a href="{{n.href}}" aria-current="{{n.current}}" style="padding: 12px; border-radius: 8px; font-size: 16px; color: {{ink}}">{{n.label}}</a>
        </sc-for>
        <a href="https://github.com/doze-dev" style="padding: 12px; font-size: 16px; color: {{ink2}}; border-top: 1px solid {{line}}; margin-top: 4px">GitHub</a>
      </nav>
    </details>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light","aws","kafka"],"default":"dark"},"current":{"editor":"enum","options":["home","doze","aws","kafka","registry","examples","docs","download","changelog","none"],"default":"none"},"news":{"editor":"text","default":""},"newsHref":{"editor":"text","default":"Registry.dc.html"},"$preview":{"width":1440,"height":72}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'dark';
    const dark = theme !== 'light';
    // each product's own night: plum for doze, navy for doze AWS, near-black olive for doze Kafka
    const ground = { dark: '#140C1B', aws: '#0C1320', kafka: '#16150F', light: '#FFFAF4' }[theme] ?? '#140C1B';
    const rule = { dark: '#2E1F3A', aws: '#1C2B44', kafka: '#2C2A1C', light: '#EADFD3' }[theme] ?? '#2E1F3A';
    const current = this.props.current ?? 'none';
    const items = [
      ['doze', 'doze', 'Doze.dc.html'],
      ['aws', 'doze AWS', 'Aws.dc.html'],
      ['kafka', 'doze Kafka', 'Kafka.dc.html'],
      ['registry', 'Registry', 'Registry.dc.html'],
      ['examples', 'Examples', 'Examples.dc.html'],
      ['docs', 'Docs', 'DocsHome.dc.html']
    ].map(([id, label, href]) => ({ label, href, current: id === current ? 'page' : false }));
    return {
      items,
      news: this.props.news ?? '',
      newsHref: this.props.newsHref ?? 'Registry.dc.html',
      cls: dark ? 'sh-dark' : 'sh-light',
      bg: ground,
      line: rule,
      panel: dark ? '#1E1328' : '#FFFFFF',
      line2: dark ? '#4A3458' : '#DCCFC2',
      ink: dark ? '#F4ECE4' : '#140C1B',
      ink2: dark ? '#C9BAD3' : '#5A4B66'
    };
  }
}
</script>
</body>
</html>
